name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Run Gradle Build
        run: |
          # Cari file gradlew di dalam folder proyek
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          
          if [ -n "$GRADLEW_PATH" ]; then
            echo "Found gradlew at: $GRADLEW_PATH"
            DIR_PATH=$(dirname "$GRADLEW_PATH")
            cd "$DIR_PATH"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found, using system gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostide-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
